name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  STATICCHECK_VERSION: '2026.2.1'

jobs:
  # 在三个平台上真正跑一遍测试。Windows 这一格是为了拦住
  # signal_windows.go 这类平台相关的编译失败。
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      # 竞态检测只在 Unix 上跑：本库有 atomic.Pointer 保护的全局默认 Logger
      # 和信号 goroutine，是竞态的高发点。Windows 上 -race 依赖额外的 C 工具链，
      # 这里跳过，编译与功能已由上面的 Test 步骤覆盖。
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=2 ./...

      # 只跑极少的迭代次数，目的是保证基准测试始终可编译可运行，
      # 而不是在共享 runner 上测性能数字。
      - name: Benchmarks (smoke)
        if: runner.os == 'Linux'
        run: go test -run '^$' -bench . -benchtime=10x ./...

  # 交叉编译到本库声明支持的所有平台。这一格能在合并前拦住
  # “只在 Linux/macOS 上编译过” 的问题。
  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build and vet for each target
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "::group::$GOOS/$GOARCH"
            GOOS="$GOOS" GOARCH="$GOARCH" go build ./...
            GOOS="$GOOS" GOARCH="$GOARCH" go vet ./...
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod / go.sum 不是最新的，请运行 go mod tidy 后提交"
            exit 1
          fi

      # 直接安装固定版本，而不是用 dominikh/staticcheck-action：
      # 该 action 内部固定引用了 actions/setup-go@v6.3.0 和 actions/cache@v4.3.0，
      # 两者都还跑在已弃用的 Node.js 20 上，会持续产生弃用告警，且无法通过升级绕开。
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}

      # 用完整路径调用，不依赖 setup-go 是否把 GOPATH/bin 加进 PATH。
      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...
